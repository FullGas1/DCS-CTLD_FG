site_name: CTLD v2 Documentation
site_description: DCS-CTLD — Combat Troops and Logistics Dispatcher
repo_url: https://github.com/FlightGyn/DCS-CTLD_FG
repo_name: DCS-CTLD_FG
edit_uri: edit/master/docs/

theme:
  name: material
  palette:
    - scheme: slate
      primary: indigo
      accent: light-blue
  features:
    - navigation.tabs
    - navigation.sections
    - navigation.top
    - search.highlight
    - content.code.copy

nav:
  - Home: index.md
  - Mission Maker Guide: missionmaker_guide.md
  - Developer Guide: dev-guide.md
  - Reference:
      - Events catalogue: specs/CTLD_Events.md
      - F10 menu tree: specs/F10_menu_tree.md

plugins:
  - search

markdown_extensions:
  - admonition
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.superfences
  - tables
